name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version per `engines`, plus the active LTS. The floor
        # is a 22.x patch rather than 22.0 because ESLint 10 requires ^22.13.
        node: ['22.13', '24']

    steps:
      - uses: actions/checkout@v7
        with:
          # Later steps run pull request code, which has no need for the token.
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Packages resolve each other through their published `exports`, so the
      # declaration files have to exist before anything reads types.
      - run: pnpm build

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
