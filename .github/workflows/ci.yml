name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Node-version coverage and OS coverage are deliberately not fully
        # crossed (which would be 2 x 2 = 4 jobs). The CLI's platform-specific
        # code (the installer's `shell: win32` branch, path separators, the
        # entry-point guard's realpath/symlink comparison) is sensitive to the
        # OS, not the Node minor version, so running Windows against both
        # Node versions would mostly duplicate signal for an extra job. The
        # floor and the active LTS are both covered on Linux, where runners
        # are cheapest; Windows is pinned to just the active LTS, since real
        # `npx`/`pnpm dlx` users are overwhelmingly on a current Node, not the
        # `engines` floor.
        include:
          # Oldest supported version per `engines`, plus the active LTS. The
          # floor is a 22.x patch rather than 22.0 because ESLint 10 requires
          # ^22.13.
          - os: ubuntu-latest
            node: '22.13'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'

    steps:
      - uses: actions/checkout@v7
        with:
          # Later steps run pull request code, which has no need for the token.
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Packages resolve each other through their published `exports`, so the
      # declaration files have to exist before anything reads types.
      - run: pnpm build

      # r/ and s/ are generated by the build above and committed so GitHub raw
      # can serve them, and so a reviewer sees what the registry will publish.
      # Regenerating without rebuilding would leave the published registries
      # describing components that no longer exist.
      - run: git diff --exit-code -- r s

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # The docs app is a Next build, which is slow and platform-insensitive.
      # Once, on the cheapest runner, is enough signal.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: pnpm build:docs

  pack-integrity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # THIRD_PARTY_NOTICES and dist/ only exist after a build; the packed
      # tarball inspected below has to reflect what a real build produces.
      - run: pnpm build

      # Inspects the actual `pnpm pack` output (the tarball `npm publish` ships):
      # the executable is present and keeps its shebang, THIRD_PARTY_NOTICES is
      # included, dist/metafile-*.json is excluded, no `catalog:` or `workspace:`
      # specifier survived into the manifest, and nothing stray rode along.
      # See packages/cli/scripts/verify-pack.ts for the checks.
      # `--fail-if-no-match` because a filter that matches nothing exits 0,
      # which would quietly turn this guard into a no-op that still reports green.
      - run: pnpm --filter @nat-ui/cli --fail-if-no-match run verify-pack

  smoke-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Serve the freshly built registry over HTTP. `add` fetches by URL, so a
      # file path is not an option.
      #
      # One step, not two: `&` makes a step exit 0 whatever the server did, so a
      # startup failure would surface half a minute later as a `wait-on` timeout
      # explaining nothing. Waiting here reports it where it happened, and the
      # log is on disk to read. Redirecting stdout also matters on its own — a
      # step ends when its stdout pipe closes, so a background process holding
      # that pipe open can hang the job.
      - run: |
          npx --yes serve r --listen 8420 > "$RUNNER_TEMP/serve.log" 2>&1 < /dev/null &
          npx --yes wait-on http://localhost:8420/index.json --timeout 30000 ||
            { cat "$RUNNER_TEMP/serve.log"; exit 1; }

      # Outside the workspace on purpose. pnpm gives it an isolated
      # node_modules containing only what the CLI installed, so an undeclared
      # dependency fails here as it would for a user.
      - run: pnpm --package=create-next-app@latest dlx create-next-app consumer
          --ts --tailwind --app --no-eslint --no-src-dir
          --import-alias "@/*" --use-pnpm --yes
        working-directory: ${{ runner.temp }}

      - run: node ${{ github.workspace }}/packages/cli/dist/index.js init --yes
        working-directory: ${{ runner.temp }}/consumer

      - run: node ${{ github.workspace }}/packages/cli/dist/index.js add button --registry http://localhost:8420
        working-directory: ${{ runner.temp }}/consumer

      # Next only compiles files a route reaches, so import installed components
      # to make this build a meaningful consumer probe.
      - run: |
          cat <<'EOF' > app/page.tsx
          import {Button} from '@/components/ui/button'

          export default function Home() {
            return (
              <main>
                <Button>Save</Button>
              </main>
            )
          }
          EOF
        working-directory: ${{ runner.temp }}/consumer

      - run: pnpm build
        working-directory: ${{ runner.temp }}/consumer

  smoke-shadcn:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Rebuilt against the local server, because a component's
      # registryDependencies are absolute URLs baked into the document. A
      # default build would send shadcn to production for `motion` and this job
      # would pass without ever testing the motion item it just built.
      - run: pnpm build
        env:
          NAT_UI_SHADCN_BASE_URL: http://localhost:8420

      - run: |
          npx --yes serve s --listen 8420 > "$RUNNER_TEMP/serve.log" 2>&1 < /dev/null &
          npx --yes wait-on http://localhost:8420/button.json --timeout 30000 ||
            { cat "$RUNNER_TEMP/serve.log"; exit 1; }

      - run: pnpm --package=create-next-app@latest dlx create-next-app consumer
          --ts --tailwind --app --no-eslint --no-src-dir
          --import-alias "@/*" --use-pnpm --yes
        working-directory: ${{ runner.temp }}

      # shadcn's own init, not nat-ui's. The whole point of this job is the path
      # taken by someone who has never heard of the nat-ui CLI.
      #
      # `-b base`, not the default prompt's first option by luck: button.tsx
      # imports from `@base-ui/react/button`, so the consumer has to pick the
      # same component library nat-ui built against, or `add` installs a
      # component the rest of `init` never wired up. `-p nova` is shadcn's
      # current default preset, which already resolves to a neutral base
      # color -- the flag this job used to pass, before shadcn's CLI replaced
      # `--base-color` with base/preset selection.
      - run: pnpm dlx shadcn@latest init -b base -p nova --yes
        working-directory: ${{ runner.temp }}/consumer

      - run: pnpm dlx shadcn@latest add http://localhost:8420/button.json --yes
        working-directory: ${{ runner.temp }}/consumer

      # Both files of the item, and the lib item it depends on, must have
      # arrived. shadcn resolving the item but silently skipping its
      # registryDependencies is the failure this catches.
      - run: |
          test -f components/ui/button.tsx
          test -f components/ui/button-variants.tsx
          test -f lib/motion.ts
          test -f lib/use-motion.ts
        working-directory: ${{ runner.temp }}/consumer

      - run: |
          cat <<'EOF' > app/page.tsx
          import {Button} from '@/components/ui/button'

          export default function Home() {
            return <Button animation='bouncy'>Press</Button>
          }
          EOF
        working-directory: ${{ runner.temp }}/consumer

      - run: pnpm build
        working-directory: ${{ runner.temp }}/consumer
