packages:
  - 'apps/*'
  - 'packages/*'

# Single source of truth for shared dependency versions across the workspace.
# Packages reference these with "catalog:" instead of a literal range.
catalog:
  '@base-ui/react': ^1.7.0
  '@changesets/cli': ^2.31.1
  '@clack/prompts': ^1.7.0
  '@eslint/js': ^10.0.1
  '@testing-library/dom': ^10.4.1
  '@testing-library/react': ^16.3.2
  '@types/node': ^22.15.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  eslint: ^10.8.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.9.0
  happy-dom: ^20.11.1
  jiti: ^2.7.0
  jsonc-parser: ^3.3.1
  lucide-react: ^1.28.0
  prettier: ^3.9.6
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwind-merge: ^3.6.0
  tsup: ^8.5.1
  tsx: ^4.23.5
  # Held at 5.x deliberately: typescript-eslint declares `typescript <6.1.0`,
  # and TypeScript 7's compiler API also breaks tsup's declaration bundler.
  typescript: ^5.9.3
  typescript-eslint: ^8.65.0
  vitest: ^4.1.10
  zod: ^4.4.3
