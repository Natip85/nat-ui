packages:
  - 'apps/*'
  - 'packages/*'

# Single source of truth for shared dependency versions across the workspace.
# Packages reference these with "catalog:" instead of a literal range.
catalog:
  '@base-ui/react': ^1.7.0
  '@changesets/cli': ^2.31.1
  '@clack/prompts': ^1.7.0
  '@eslint/js': ^10.0.1
  '@tailwindcss/postcss': ^4.3.3
  '@testing-library/dom': ^10.4.1
  '@testing-library/react': ^16.3.2
  '@types/mdx': ^2.0.14
  '@types/node': ^22.15.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  eslint: ^10.8.0
  eslint-config-prettier: ^10.1.8
  fumadocs-core: 16.14.0
  fumadocs-mdx: 15.2.2
  fumadocs-ui: npm:@fumadocs/base-ui@16.14.0
  globals: ^17.9.0
  happy-dom: ^20.11.1
  jiti: ^2.7.0
  jsonc-parser: ^3.3.1
  lucide-react: ^1.28.0
  next: 16.3.0
  postcss: ^8.5.24
  prettier: ^3.9.6
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tsup: ^8.5.1
  tsx: ^4.23.5
