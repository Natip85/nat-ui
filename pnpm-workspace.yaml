packages:
  - 'apps/*'
  - 'packages/*'

# Single source of truth for shared dependency versions across the workspace.
# Packages reference these with "catalog:" instead of a literal range.
catalog:
  '@changesets/cli': ^2.31.1
  '@eslint/js': ^10.0.1
  '@types/node': ^22.15.0
  eslint: ^10.8.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.9.0
  jiti: ^2.7.0
  prettier: ^3.9.6
  tsup: ^8.5.1
  tsx: ^4.23.5
  # Held at 5.x deliberately: typescript-eslint declares `typescript <6.1.0`,
  # and TypeScript 7's compiler API also breaks tsup's declaration bundler.
  typescript: ^5.9.3
  typescript-eslint: ^8.65.0
  vitest: ^4.1.10
  zod: ^4.4.3
